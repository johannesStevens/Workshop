apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-to-authentik
  namespace: grafana
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: authentik
    ports:
    - protocol: TCP
      port: 9000
    - protocol: TCP
      port: 9443
